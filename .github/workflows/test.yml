name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests
      - name: Security lint
        run: python -m bandit -q -r src


  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        working-directory: supabase/functions/masamune-webhook
        run: deno fmt --check
      - name: Lint edge
        working-directory: supabase/functions/masamune-webhook
        run: deno lint
      - name: Type check
        working-directory: supabase/functions/masamune-webhook
        run: deno check --config deno.json index.ts edge_test.ts
      - name: Edge tests
        working-directory: supabase/functions/masamune-webhook
        run: deno test --config deno.json edge_test.ts
